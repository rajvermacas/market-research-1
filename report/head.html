<title>The Dip Buy Audit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme: light;
  --plane:#eef1f4; --surface:#fbfcfd; --surface-2:#f4f6f8;
  --ink:#101418; --ink-2:#454c53; --muted:#6d747b;
  --rule:#dce1e6; --rule-strong:#c2c9d0;
  --accent:#1c5cab; --accent-soft:#e6eefa;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --neg:#c4362f; --neg-soft:#fbeae9; --pos:#0a7a37; --pos-soft:#e6f4ec;
  --grid:#e5e9ed; --shadow:0 1px 2px rgba(16,20,24,.05),0 8px 24px -16px rgba(16,20,24,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --plane:#0e1113; --surface:#16191c; --surface-2:#1c2023;
    --ink:#eef1f3; --ink-2:#b3bac1; --muted:#868e96;
    --rule:#272c30; --rule-strong:#39403f;
    --accent:#6ba5ec; --accent-soft:#182534;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70;
    --neg:#e07068; --neg-soft:#2a1c1b; --pos:#3fa96a; --pos-soft:#152420;
    --grid:#23282c; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -16px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --plane:#0e1113; --surface:#16191c; --surface-2:#1c2023;
  --ink:#eef1f3; --ink-2:#b3bac1; --muted:#868e96;
  --rule:#272c30; --rule-strong:#39403f;
  --accent:#6ba5ec; --accent-soft:#182534;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --neg:#e07068; --neg-soft:#2a1c1b; --pos:#3fa96a; --pos-soft:#152420;
  --grid:#23282c; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -16px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  background:var(--plane); color:var(--ink);
  font-family:"Source Serif 4",Georgia,"Times New Roman",serif;
  font-size:17px; line-height:1.62; margin:0;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px 96px}
.col{max-width:660px}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
h1,h2,h3,.disp{font-family:Archivo,system-ui,-apple-system,"Segoe UI",sans-serif;text-wrap:balance}
a{color:var(--accent)}
p{margin:0 0 1.05em}
.eyebrow{
  font-family:"IBM Plex Mono",monospace; font-size:11.5px; font-weight:500;
  letter-spacing:.16em; text-transform:uppercase; color:var(--muted); margin:0 0 14px;
}

/* ---------- masthead ---------- */
header.mast{border-bottom:2px solid var(--ink);padding:56px 0 26px;margin-bottom:38px}
header.mast h1{
  font-size:clamp(38px,6.4vw,66px); line-height:1.0; font-weight:700;
  letter-spacing:-.028em; margin:0 0 20px;
}
.standfirst{font-size:20px;line-height:1.5;color:var(--ink-2);max-width:660px;margin:0 0 26px}
.standfirst strong{color:var(--ink);font-weight:600}
.byline{
  display:flex;flex-wrap:wrap;gap:8px 22px;align-items:baseline;
  font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted);
}
.byline a{text-decoration:none;border-bottom:1px solid var(--rule-strong);color:var(--ink-2)}
.byline a:hover{border-color:var(--accent);color:var(--accent)}

/* ---------- verdict ---------- */
.verdicts{display:grid;grid-template-columns:repeat(auto-fit,minmax(238px,1fr));gap:14px;margin:0 0 44px}
.verdict{
  background:var(--surface);border:1px solid var(--rule);border-radius:3px;
  padding:20px 22px;box-shadow:var(--shadow);border-left:3px solid var(--v,var(--accent));
}
.verdict .tag{
  font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--v,var(--accent));margin:0 0 8px;display:block;
}
.verdict .claim{font-family:Archivo,sans-serif;font-size:19px;font-weight:600;line-height:1.25;margin:0 0 7px;letter-spacing:-.01em}
.verdict p{font-size:15px;line-height:1.5;color:var(--ink-2);margin:0}

/* ---------- sections ---------- */
section{margin:0 0 60px}
h2{font-size:15px;font-weight:600;letter-spacing:-.005em;margin:0 0 6px}
.sec-head{border-top:1px solid var(--ink);padding-top:14px;margin-bottom:26px;display:flex;gap:18px;align-items:baseline;flex-wrap:wrap}
.sec-head .num{
  font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;color:var(--muted);
  letter-spacing:.1em;flex:0 0 auto;padding-top:3px;
}
.sec-head .titles{flex:1 1 300px;min-width:0}
.sec-head h2{font-size:27px;font-weight:700;letter-spacing:-.022em;line-height:1.16;margin:0}
.sec-head .kicker{font-size:15px;color:var(--muted);margin:5px 0 0;font-style:italic}

/* ---------- figures & charts ---------- */
figure{margin:26px 0 0;background:var(--surface);border:1px solid var(--rule);border-radius:3px;padding:20px 22px 16px;box-shadow:var(--shadow)}
figure .fig-title{font-family:Archivo,sans-serif;font-size:15.5px;font-weight:600;margin:0 0 3px;letter-spacing:-.008em}
figure .fig-sub{font-size:13.5px;color:var(--muted);margin:0 0 16px;line-height:1.45}
figcaption{font-size:13.5px;color:var(--ink-2);line-height:1.5;margin-top:14px;padding-top:12px;border-top:1px solid var(--rule)}
.chart-scroll{overflow-x:auto;overflow-y:hidden}
.chart-host{position:relative;min-width:520px}
svg.chart{display:block;width:100%;height:auto;overflow:visible}
.gridline{stroke:var(--grid);stroke-width:1}
.axisline{stroke:var(--rule-strong);stroke-width:1}
.tick{font-family:"IBM Plex Mono",monospace;font-size:10.5px;fill:var(--muted);font-variant-numeric:tabular-nums}
.dlabel{font-family:Archivo,sans-serif;font-size:12px;font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:6px 20px;margin:0 0 14px;font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-2)}
.legend span.k{display:inline-flex;align-items:center;gap:7px}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}

/* tooltip */
.tip{
  position:absolute;pointer-events:none;opacity:0;transition:opacity .1s;
  background:var(--surface);border:1px solid var(--rule-strong);border-radius:3px;
  box-shadow:var(--shadow);padding:9px 11px;font-family:"IBM Plex Mono",monospace;
  font-size:11.5px;color:var(--ink);white-space:nowrap;z-index:5;font-variant-numeric:tabular-nums;
}
.tip b{display:block;font-weight:600;margin-bottom:5px;color:var(--muted);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}
.tip .row{display:flex;gap:12px;justify-content:space-between;align-items:center}
.tip .row i{width:9px;height:9px;border-radius:2px;flex:0 0 auto;margin-right:-4px}

/* ---------- tables ---------- */
.tbl-scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-family:"IBM Plex Mono",monospace;font-size:13px;font-variant-numeric:tabular-nums;min-width:520px}
th,td{text-align:right;padding:9px 12px;border-bottom:1px solid var(--rule);white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
thead th{
  font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);border-bottom:1px solid var(--rule-strong);padding-bottom:8px;
}
tbody tr:last-child td{border-bottom:none}
tbody tr.total td{border-top:1px solid var(--rule-strong);font-weight:600}
td.pos{color:var(--pos)} td.neg{color:var(--neg)}
.chip{
  display:inline-block;padding:1px 7px;border-radius:2px;font-size:10.5px;font-weight:600;
  letter-spacing:.06em;text-transform:uppercase;
}
.chip.ok{background:var(--pos-soft);color:var(--pos)}
.chip.warn{background:var(--neg-soft);color:var(--neg)}

/* ---------- stat tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:3px;overflow:hidden;margin:26px 0 0}
.tile{background:var(--surface);padding:17px 18px}
.tile .v{font-family:Archivo,sans-serif;font-size:29px;font-weight:700;letter-spacing:-.03em;line-height:1.05;margin:0 0 5px}
.tile .v.neg{color:var(--neg)} .tile .v.pos{color:var(--pos)}
.tile .l{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);line-height:1.4}
.tile .n{font-size:13px;color:var(--ink-2);margin:6px 0 0;line-height:1.4}

/* ---------- rules block ---------- */
.rules{background:var(--surface-2);border:1px solid var(--rule);border-radius:3px;padding:22px 24px;margin:0 0 8px}
.rules ol{margin:0;padding-left:20px;font-family:"IBM Plex Mono",monospace;font-size:13.5px;line-height:1.85;color:var(--ink)}
.rules li::marker{color:var(--muted)}
.rules .src{font-size:13px;color:var(--muted);margin:14px 0 0;font-family:"Source Serif 4",serif;font-style:italic}

.callout{
  border-left:3px solid var(--accent);background:var(--accent-soft);
  padding:16px 20px;border-radius:0 3px 3px 0;margin:24px 0;font-size:16px;line-height:1.55;
}
.callout p{margin:0}
.callout strong{font-weight:600}

ul.plain{padding-left:20px;margin:0 0 1.05em}
ul.plain li{margin-bottom:.5em}
ul.plain li::marker{color:var(--muted)}

footer{border-top:1px solid var(--rule-strong);padding-top:24px;margin-top:20px;font-size:14px;color:var(--muted);line-height:1.6}
footer h3{font-family:Archivo,sans-serif;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin:0 0 10px}
footer code{font-family:"IBM Plex Mono",monospace;font-size:12.5px;background:var(--surface-2);padding:1px 5px;border-radius:2px;color:var(--ink-2)}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:640px){
  body{font-size:16px}
  .wrap{padding:0 16px 64px}
  header.mast{padding-top:36px}
}
</style>
